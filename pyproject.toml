[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-kernel"
version = "0.1.0"
description = "Intent OS — Cognitive Operating System Kernel"
readme = "README.md"
# TP-07E: narrowed to >=3.13 because ONLY 3.13 and 3.14 interpreters are
# available in this environment. Compatibility on 3.11/3.12 is NOT verified
# and must NOT be claimed. The preview CLI itself uses only the stdlib and
# would work on 3.11+, but the declaration must match executable evidence.
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Celso Santos"}
]
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]
openai = [
    "openai>=1.0",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
all = [
    "intent-kernel[server,openai,postgres,dev]",
]

[project.scripts]
intent-os = "intent_kernel.__main__:main"
intent-os-server = "intent_kernel.server.app:run"
# TP-07B: local governed Technical Preview CLI.
# Verified by import-graph audit: importing intent_kernel.preview.__main__ pulls
# in NO third-party package, so this entry point runs on the standard library
# alone. The package's `dependencies` above remain because the WIDER
# application needs them; they are not removed and not claimed unnecessary.
intentos-preview = "intent_kernel.preview.__main__:main"

[tool.setuptools.packages.find]
include = ["intent_kernel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["intent_kernel", "intent_os_desktop"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
